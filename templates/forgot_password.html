<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Cloud Bus Pass System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🔐 Forgot Password</h1>

    <p>
        Enter your registered email address and we will
        send you a verification OTP.
    </p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if success %}
        <p class="success">{{ success }}</p>
    {% endif %}

    <form method="POST"
          action="{{ url_for('forgot_password') }}">

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your registered email"
            required
        >

        <button type="submit">
            Send OTP
        </button>

    </form>

    <br>

    <a href="{{ url_for('login') }}">
        ← Back to Login
    </a>

</div>

</body>
</html>
