<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Cloud Bus Pass System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* =====================================================
           FEATURE 10 - FORGOT PASSWORD
        ===================================================== */

        .forgot-password {
            display: inline-block;
            margin-top: 8px;
            margin-bottom: 15px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Login</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if success %}
            <p class="success">{{ success }}</p>
        {% endif %}

        <form method="POST"
              action="{{ url_for('login') }}">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>


        <!-- =================================================
             FEATURE 10 - FORGOT PASSWORD
        ================================================== -->

        <p>
            <a href="{{ url_for('forgot_password') }}"
               class="forgot-password">
                🔐 Forgot Password?
            </a>
        </p>


        <p>
            Don't have an account?
        </p>

        <a href="{{ url_for('register') }}">
            Register here
        </a>

        <br><br>

        <a href="{{ url_for('home') }}">
            Back to Home
        </a>

    </div>

</body>
</html>
